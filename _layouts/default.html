<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="bg-surface text-text font-serif antialiased">
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}

  <!-- Publication hover and press state -->
  <script>
    document.querySelectorAll('.publication').forEach(function(pub) {
      pub.querySelectorAll('.publication-hit').forEach(function(el) {
        el.addEventListener('mouseenter', function() {
          pub.classList.add('is-hover');
        });
        el.addEventListener('mouseleave', function() {
          pub.classList.remove('is-hover');
        });
        el.addEventListener('focusin', function() {
          pub.classList.add('is-hover');
        });
        el.addEventListener('focusout', function() {
          pub.classList.remove('is-hover');
        });
      });
    });

    document.querySelectorAll('.publication').forEach(function(pub) {
      pub.querySelectorAll('.publication-hit').forEach(function(el) {
        el.addEventListener('touchstart', function() {
          pub.classList.add('is-press');
        }, { passive: true });
        el.addEventListener('touchend', function() {
          pub.classList.remove('is-press');
        });
        el.addEventListener('touchcancel', function() {
          pub.classList.remove('is-press');
        });
      });
    });
  </script>
</body>
</html>
