<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="bg-surface text-text font-serif antialiased">
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}

  <!-- Publication hover and scroll state -->
  <script>
    document.querySelectorAll('.publication').forEach(function(pub) {
      pub.querySelectorAll('.publication-hit').forEach(function(el) {
        el.addEventListener('mouseenter', function() {
          pub.classList.add('is-hover');
        });
        el.addEventListener('mouseleave', function() {
          pub.classList.remove('is-hover');
        });
        el.addEventListener('focusin', function() {
          pub.classList.add('is-hover');
        });
        el.addEventListener('focusout', function() {
          pub.classList.remove('is-hover');
        });
      });
    });

    var touch = window.matchMedia('(hover: none), (pointer: coarse), (max-width: 1024px)');
    if (touch.matches && 'IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          entry.target.classList.toggle('is-scroll', entry.isIntersecting);
        });
      }, {
        rootMargin: '-35% 0px -35% 0px',
        threshold: 0
      });

      document.querySelectorAll('.publication').forEach(function(pub) {
        observer.observe(pub);
      });
    }
  </script>
</body>
</html>
